<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random HTML Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #2e8b57;
    }
    p {
      font-size: 18px;
      color: #555;
    }
    button {
      background-color: #2e8b57;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #3cb371;
    }
  </style>
</head>
<body>
  <h1>Hello, Random World!</h1>
  <p>This is a randomly generated HTML snippet with some CSS styling.</p>
  <button onclick="alert('You clicked me!')">Click Me</button>
</body>
</html>
